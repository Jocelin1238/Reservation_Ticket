<div class="auth-page">

  <div class="auth-container">

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div class="auth-header">

      <div class="logo-icon">

        <span class="material-icons">
          lock_reset
        </span>

      </div>

      <h1>
        Nouveau mot de passe
      </h1>

      <p>
        Entrez le code reçu par email puis
        choisissez votre nouveau mot de passe.
      </p>

    </div>


    <!-- ================================================= -->
    <!-- CARD -->
    <!-- ================================================= -->

    <div class="auth-card">


      <!-- ERREUR -->

      <div
        class="message error"
        *ngIf="erreur">

        <span class="material-icons">
          error_outline
        </span>

        <span>
          {{ erreur }}
        </span>

      </div>


      <!-- SUCCÈS -->

      <div
        class="message success"
        *ngIf="succes">

        <span class="material-icons">
          check_circle
        </span>

        <span>
          {{ succes }}
        </span>

      </div>


      <form
        #resetForm="ngForm"
        (ngSubmit)="reinitialiserMotDePasse(resetForm)"
        novalidate>


        <!-- ================================================= -->
        <!-- EMAIL -->
        <!-- ================================================= -->

        <div class="form-group">

          <label for="email">
            Adresse email
          </label>

          <div class="input-wrapper">

            <span class="material-icons">
              email
            </span>

            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              placeholder="exemple@gmail.com">

          </div>

        </div>


        <!-- ================================================= -->
        <!-- OTP -->
        <!-- ================================================= -->

        <div class="form-group">

          <label for="otp">
            Code de vérification
          </label>

          <div class="input-wrapper">

            <span class="material-icons">
              verified
            </span>

            <input
              id="otp"
              type="text"
              name="otp"
              [(ngModel)]="otp"
              required
              minlength="4"
              maxlength="10"
              placeholder="Entrez le code reçu">

          </div>

        </div>


        <!-- ================================================= -->
        <!-- NOUVEAU MOT DE PASSE -->
        <!-- ================================================= -->

        <div class="form-group">

          <label for="nouveauMotDePasse">
            Nouveau mot de passe
          </label>

          <div class="input-wrapper">

            <span class="material-icons">
              lock
            </span>

            <input
              id="nouveauMotDePasse"
              [type]="
                afficherMotDePasse
                  ? 'text'
                  : 'password'
              "
              name="nouveauMotDePasse"
              [(ngModel)]="nouveauMotDePasse"
              required
              minlength="6"
              placeholder="Minimum 6 caractères">

            <button
              type="button"
              class="eye-button"
              (click)="toggleMotDePasse()">

              <span class="material-icons">

                {{
                  afficherMotDePasse
                    ? 'visibility_off'
                    : 'visibility'
                }}

              </span>

            </button>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- CONFIRMATION -->
        <!-- ================================================= -->

        <div class="form-group">

          <label for="confirmationMotDePasse">
            Confirmer le mot de passe
          </label>

          <div class="input-wrapper">

            <span class="material-icons">
              lock_outline
            </span>

            <input
              id="confirmationMotDePasse"
              [type]="
                afficherConfirmation
                  ? 'text'
                  : 'password'
              "
              name="confirmationMotDePasse"
              [(ngModel)]="confirmationMotDePasse"
              required
              minlength="6"
              placeholder="Confirmez votre mot de passe">

            <button
              type="button"
              class="eye-button"
              (click)="toggleConfirmation()">

              <span class="material-icons">

                {{
                  afficherConfirmation
                    ? 'visibility_off'
                    : 'visibility'
                }}

              </span>

            </button>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- SUBMIT -->
        <!-- ================================================= -->

        <button
          type="submit"
          class="submit-button"
          [disabled]="chargement">

          <span
            *ngIf="!chargement"
            class="material-icons">

            lock_reset

          </span>

          <span
            *ngIf="chargement"
            class="spinner">
          </span>

          <span>

            {{
              chargement
                ? 'Modification...'
                : 'Modifier le mot de passe'
            }}

          </span>

        </button>

      </form>


      <!-- ================================================= -->
      <!-- RENVOYER OTP -->
      <!-- ================================================= -->

      <button
        type="button"
        class="resend-button"
        (click)="renvoyerOtp()"
        [disabled]="chargement">

        <span class="material-icons">
          refresh
        </span>

        Renvoyer un nouveau code

      </button>


      <!-- ================================================= -->
      <!-- RETOUR -->
      <!-- ================================================= -->

      <button
        type="button"
        class="back-link"
        (click)="retournerLogin()">

        <span class="material-icons">
          arrow_back
        </span>

        Retour à la connexion

      </button>

    </div>

  </div>

</div>
