<div class="auth-page">

  <div class="auth-container">

    <!-- ================================================= -->
    <!-- LOGO / EN-TÊTE -->
    <!-- ================================================= -->

    <div class="auth-header">

      <div class="logo-icon">
        <span class="material-icons">
          directions_bus
        </span>
      </div>

      <h1>
        Mot de passe oublié ?
      </h1>

      <p>
        Pas d'inquiétude. Entrez votre adresse email
        pour recevoir un code de vérification.
      </p>

    </div>


    <!-- ================================================= -->
    <!-- CARTE -->
    <!-- ================================================= -->

    <div class="auth-card">

      <!-- ERREUR -->

      <div
        class="message error"
        *ngIf="erreur">

        <span class="material-icons">
          error_outline
        </span>

        <span>
          {{ erreur }}
        </span>

      </div>


      <!-- SUCCÈS -->

      <div
        class="message success"
        *ngIf="succes">

        <span class="material-icons">
          check_circle
        </span>

        <span>
          {{ succes }}
        </span>

      </div>


      <form
        #forgotForm="ngForm"
        (ngSubmit)="envoyerOtp(forgotForm)"
        novalidate>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Adresse email
          </label>

          <div class="input-wrapper">

            <span class="material-icons">
              email
            </span>

            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              placeholder="exemple@gmail.com"
              autocomplete="email">

          </div>

          <small
            *ngIf="
              forgotForm.submitted &&
              forgotForm.controls['email']?.invalid
            "
            class="field-error">

            Veuillez saisir une adresse email valide.

          </small>

        </div>


        <!-- BOUTON -->

        <button
          type="submit"
          class="submit-button"
          [disabled]="chargement">

          <span
            *ngIf="!chargement"
            class="material-icons">

            send

          </span>

          <span
            *ngIf="chargement"
            class="spinner">
          </span>

          <span>

            {{
              chargement
                ? 'Envoi en cours...'
                : 'Envoyer le code'
            }}

          </span>

        </button>

      </form>


      <!-- RETOUR LOGIN -->

      <button
        type="button"
        class="back-link"
        (click)="allerLogin()">

        <span class="material-icons">
          arrow_back
        </span>

        Retour à la connexion

      </button>


      <!-- REGISTER -->

      <div class="register-link">

        <span>
          Vous n'avez pas encore de compte ?
        </span>

        <button
          type="button"
          (click)="allerRegister()">

          Créer un compte

        </button>

      </div>

    </div>

  </div>

</div>
