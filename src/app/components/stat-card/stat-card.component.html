<div class="stat-card">


    <div class="icon">


        <!-- Utilisateurs -->
        <svg *ngIf="icon === 'people'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3
            -3 1.34-3 3 1.34 3 3 3z"/>

            <path d="M8 11c1.66 0 3-1.34 3-3S9.66 5 8 5
            5 6.34 5 8s1.34 3 3 3z"/>

            <path d="M8 13c-2.33 0-7 1.17-7 3.5V19h14v-2.5
            C15 14.17 10.33 13 8 13z"/>

        </svg>



        <!-- Administrateur -->
        <svg *ngIf="icon === 'admin'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12
            5.16-1.26 9-6.45 9-12V5l-9-4z"/>

        </svg>



        <!-- Staff -->
        <svg *ngIf="icon === 'staff'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4
            -4 1.79-4 4 1.79 4 4 4z"/>

            <path d="M4 20c0-3 4-5 8-5s8 2 8 5"/>

        </svg>



        <!-- Bus -->
        <svg *ngIf="icon === 'bus'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M4 16v2c0 1.1.9 2 2 2h1l1-2h8l1 2h1c1.1
            0 2-.9 2-2v-2H4z"/>

            <path d="M18 4H6c-1.1 0-2 .9-2 2v8h16V6
            c0-1.1-.9-2-2-2z"/>

        </svg>



        <!-- Ticket -->
        <svg *ngIf="icon === 'ticket'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M21 8V6c0-1.1-.9-2-2-2H5
            c-1.1 0-2 .9-2 2v2c1.1 0 2 .9 2 2s-.9 2-2 2v2
            c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-2
            c-1.1 0-2-.9-2-2s.9-2 2-2z"/>

        </svg>



        <!-- Argent -->
        <svg *ngIf="icon === 'money'"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">

            <path d="M12 2C6.48 2 2 5.58 2 10s4.48 8 10 8
            10-3.58 10-8-4.48-8-10-8z"/>

        </svg>


    </div>



    <div class="info">

        <h3>
            {{title}}
        </h3>


        <p>
            {{value}}
        </p>


    </div>


</div>
